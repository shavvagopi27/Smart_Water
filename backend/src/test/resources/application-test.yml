spring:
  datasource:
    url: jdbc:h2:mem:smartwater;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
app:
  jwt:
    secret: test-secret-test-secret-test-secret-123456
  alerts:
    cron: "-"
  billing:
    auto-cycle:
      enabled: false
  tips:
    cron: "-"
  seed:
    enabled: false
