spring:
  application:
    name: smart-water
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartwater}
    username: ${DB_USERNAME:smartwater}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # schema is owned by Flyway
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: 8080
  error:
    include-message: never

app:
  jwt:
    secret: ${JWT_SECRET}                       # required, min 32 chars
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}
  mail:
    enabled: ${MAIL_ENABLED:false}              # false = emails are only logged
    from: ${MAIL_FROM:no-reply@smartwater.local}
  alerts:
    cron: ${ALERT_CRON:0 0 6 * * *}
    high-usage-threshold-kl: ${ALERT_HIGH_USAGE_KL:1.0}   # per household per day
    high-usage-factor: ${ALERT_HIGH_USAGE_FACTOR:2.0}     # x apartment daily average
    std-dev-multiplier: ${ALERT_STDDEV_MULTIPLIER:2.0}
    history-window-days: 30
    min-history-days: 7
  billing:
    payment-instructions: ${PAYMENT_INSTRUCTIONS:Pay at the apartment management office or by bank transfer. Use the invoice number as the payment reference.}
    auto-cycle:
      enabled: ${BILLING_AUTO_CYCLE_ENABLED:false}
      cron: ${BILLING_AUTO_CYCLE_CRON:0 0 2 1 * *}
  tips:
    email-enabled: ${TIPS_EMAIL_ENABLED:false}
    cron: ${TIPS_EMAIL_CRON:0 0 9 * * MON}
  seed:
    enabled: ${SEED_DEMO_DATA:true}              # demo/local data only

springdoc:
  swagger-ui:
    path: /swagger-ui.html
